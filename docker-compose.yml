services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lowqueue
      POSTGRES_USER: lowqueue
      POSTGRES_PASSWORD: lowqueue_dev
    ports:
      - "5432:5432"
    volumes:
      - lowqueue-postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lowqueue -d lowqueue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lowqueue-postgres:
